name: Deploy Production Storefront

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-tenant-web
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build storefront
        run: npm run build

  deploy:
    name: Deploy on production VPS
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Sync source to VPS
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./.next' \
            --exclude='./coverage' \
            --exclude='./shots' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            -czf - . | sshpass -e ssh -o StrictHostKeyChecking=no "$VPS_SSH_USER@$VPS_HOST" \
              "mkdir -p /opt/nawyorders/tenant-web && tar -xzf - -C /opt/nawyorders/tenant-web"

      - name: Build and deploy container
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no "$VPS_SSH_USER@$VPS_HOST" \
            "cd /opt/nawyorders/tenant-web && IMAGE_TAG='$IMAGE_TAG' bash deploy/tenant-web.sh"
